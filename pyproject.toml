[project]
name = "colrev-scidb"
description = "TODO"
version = "0.1.0"
license = {text = "MIT"}
authors = [
    { name = "Julian Prester", email = "hi@julianprester.com" }
]
keywords = ["colrev"]
requires-python = ">=3.8, <4"
dependencies = [
    "requests<2.32.0",
    "tenacity>=8.4.1",
    "pymupdf>=1.24.3",
]

[project.urls]
repository = "https://github.com/julianprester/scidb"

[tool.hatch.build.targets.wheel]
include = "scidb"

[tool.colrev]
colrev_doc_description = "TODO"
colrev_doc_link = "docs/README.md"
search_types = []

[project.entry-points.colrev]
pdf_get = "scidb.scidb_pdf_get:ScidbPdfGet"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
